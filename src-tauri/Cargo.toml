[package]
name = "note-share"
version = "0.4.0"
description = "个人笔记软件：Obsidian 兼容、可单篇发布分享"
edition = "2021"

[lib]
name = "note_share_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# 客户端更新 + 热更新：updater 全量安装包，process 装完重启
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 热更新资源（manifest/zip）由 Rust 侧下载：无 CORS、不走 WebView fetch
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
# 语音块的麦克风权限：WebView2 默认拒绝 getUserMedia，需手动放行（版本与 tauri 内部一致）
webview2-com = "0.39"

[profile.release]
opt-level = "s"
lto = true
