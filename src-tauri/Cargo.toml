[package]
name = "note-share"
version = "0.1.0"
description = "个人笔记软件：Obsidian 兼容、可单篇发布分享"
edition = "2021"

[lib]
name = "note_share_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"

[profile.release]
opt-level = "s"
lto = true
