# 三道质量门禁：push main / PR 时并行跑，任一失败挡合并（配合分支保护规则）
#   i18n  —— 中英文案 key 对齐、引用不悬空、插值占位符一致
#   theme —— 亮/暗主题 CSS 变量成对、var() 引用有定义
#   review—— 代码审查：ESLint（hooks/未用变量/明显错误）+ tsc 类型检查
name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-i18n.mjs

  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-theme.mjs

  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
