# 打标签（v*）即发布：macOS（Apple Silicon + Intel）与 Windows 三路并行构建，
# 产物（dmg / nsis exe / msi）自动挂到同名 GitHub Release（草稿，确认后手动发布）。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # tag 版本号写进三处配置，免去手动改版本
      - name: Sync version from tag
        run: node scripts/sync-version.mjs ${{ github.ref_name }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NoteShare ${{ github.ref_name }}"
          releaseBody: |
            打包产物：
            - macOS：.dmg（Apple Silicon / Intel 各一；未做开发者签名，首次打开请右键 → 打开）
            - Windows：NSIS 安装包（-setup.exe）与 MSI（.msi）
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
